# Free cloud runner (GitHub Actions), started every hour by an external
# cron-job.org job through the workflow_dispatch API (fine-grained token,
# Actions read/write, this repo only; expires 2027-01-12). There is no GitHub
# schedule: it dropped most runs, and each extra run costs billed minutes.
#
# Billing rounds every run up to a whole minute (2,000 free minutes a month on
# a private repo). To stay under one minute, the compiled bot is cached and Go
# is only installed and the bot rebuilt when its code changed.
# State lives in the Google Sheet, so runs
# need no storage of their own; only the OpenStreetMap lookup cache is carried
# between runs (actions/cache), and losing it is harmless.
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   APTBOT_CONFIG   the whole aptbot/config.json
#   GOOGLE_SA_JSON  the service-account key (aptbot/secrets/service-account.json)
# Until both are set, runs are skipped (no failure emails).
#
# Caveat: GitHub runs on datacenter IPs; ImmoScout may block those. If it
# does, the bot stops asking ImmoScout for that run (403/429) and the other
# sites still work.
name: aptbot
on:
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Only send a test notification (checks ntfy from the cloud)"
        type: boolean
        default: false
concurrency: aptbot
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: aptbot
    steps:
      - name: Check secrets
        id: secrets
        env:
          APTBOT_CONFIG: ${{ secrets.APTBOT_CONFIG }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        working-directory: .
        run: |
          if [ -z "$APTBOT_CONFIG" ] || [ -z "$GOOGLE_SA_JSON" ]; then
            echo "::notice::APTBOT_CONFIG / GOOGLE_SA_JSON secrets not set, skipping this run"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ok == 'true'
        name: Restore compiled bot
        id: bin
        uses: actions/cache/restore@v4
        with:
          path: aptbot/aptbot
          key: aptbot-bin-${{ runner.os }}-${{ hashFiles('aptbot/go.mod', 'aptbot/**/*.go') }}
      - if: steps.secrets.outputs.ok == 'true' && steps.bin.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with: { go-version-file: aptbot/go.mod, cache: false }
      - if: steps.secrets.outputs.ok == 'true' && steps.bin.outputs.cache-hit != 'true'
        name: Build
        run: go build -trimpath -o aptbot ./cmd/aptbot
      - if: steps.secrets.outputs.ok == 'true' && steps.bin.outputs.cache-hit != 'true'
        name: Save compiled bot
        uses: actions/cache/save@v4
        with:
          path: aptbot/aptbot
          key: aptbot-bin-${{ runner.os }}-${{ hashFiles('aptbot/go.mod', 'aptbot/**/*.go') }}
      - if: steps.secrets.outputs.ok == 'true'
        name: Restore OpenStreetMap cache
        uses: actions/cache/restore@v4
        with:
          path: aptbot/data/transit-cache.json
          key: transit-cache-${{ github.run_id }}
          restore-keys: transit-cache-
      - if: steps.secrets.outputs.ok == 'true'
        name: Write config
        env:
          APTBOT_CONFIG: ${{ secrets.APTBOT_CONFIG }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          mkdir -p secrets
          printf '%s' "$APTBOT_CONFIG" > config.json
          printf '%s' "$GOOGLE_SA_JSON" > secrets/service-account.json
      - if: steps.secrets.outputs.ok == 'true'
        name: Run
        run: |
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            ./aptbot -test-alert -config config.json
          else
            ./aptbot -once -skip immowelt -config config.json # immowelt blocks datacenter IPs; it runs on the Mac
          fi
      - if: always() && steps.secrets.outputs.ok == 'true'
        name: Save OpenStreetMap cache
        uses: actions/cache/save@v4
        with:
          path: aptbot/data/transit-cache.json
          key: transit-cache-${{ github.run_id }}
