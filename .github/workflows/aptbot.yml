# Free cloud runner (GitHub Actions), started every 15 minutes by an external
# cron-job.org job through the workflow_dispatch API (fine-grained token,
# Actions read/write, this repo only; expires 2027-01-12). There is no GitHub
# schedule: it dropped most runs.
#
# The repo is public, so Actions minutes are free and unlimited; it also means
# anyone can read the run logs (see the Run step, which keeps them minimal).
# The compiled bot is cached and Go is only installed and the bot rebuilt when
# its code changed, so a run takes well under a minute.
# State lives in the Google Sheet, so runs
# need no storage of their own; only the OpenStreetMap lookup cache is carried
# between runs (actions/cache), and losing it is harmless.
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   APTBOT_CONFIG   the whole aptbot/config.json
#   GOOGLE_SA_JSON  the service-account key (aptbot/secrets/service-account.json)
# Until both are set, runs are skipped (no failure emails).
#
# Caveat: GitHub runs on datacenter IPs; ImmoScout may block those. If it
# does, the bot stops asking ImmoScout for that run (403/429) and the other
# sites still work.
name: aptbot
on:
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Only send a test notification (checks ntfy from the cloud)"
        type: boolean
        default: false
concurrency: aptbot
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: aptbot
    steps:
      - name: Check secrets
        id: secrets
        env:
          APTBOT_CONFIG: ${{ secrets.APTBOT_CONFIG }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        working-directory: .
        run: |
          if [ -z "$APTBOT_CONFIG" ] || [ -z "$GOOGLE_SA_JSON" ]; then
            echo "::notice::APTBOT_CONFIG / GOOGLE_SA_JSON secrets not set, skipping this run"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ok == 'true'
        name: Restore compiled bot
        id: bin
        uses: actions/cache/restore@v4
        with:
          path: aptbot/aptbot
          key: aptbot-bin-${{ runner.os }}-${{ hashFiles('aptbot/go.mod', 'aptbot/**/*.go', 'aptbot/**/*.json.gz') }}
      - if: steps.secrets.outputs.ok == 'true' && steps.bin.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with: { go-version-file: aptbot/go.mod, cache: false }
      - if: steps.secrets.outputs.ok == 'true' && steps.bin.outputs.cache-hit != 'true'
        name: Build
        run: go build -trimpath -o aptbot ./cmd/aptbot
      - if: steps.secrets.outputs.ok == 'true' && steps.bin.outputs.cache-hit != 'true'
        name: Save compiled bot
        uses: actions/cache/save@v4
        with:
          path: aptbot/aptbot
          key: aptbot-bin-${{ runner.os }}-${{ hashFiles('aptbot/go.mod', 'aptbot/**/*.go', 'aptbot/**/*.json.gz') }}
      - if: steps.secrets.outputs.ok == 'true'
        name: Restore OpenStreetMap cache
        uses: actions/cache/restore@v4
        with:
          path: aptbot/data/transit-cache.json
          key: transit-cache-${{ github.run_id }}
          restore-keys: transit-cache-
      - if: steps.secrets.outputs.ok == 'true'
        name: Write config
        env:
          APTBOT_CONFIG: ${{ secrets.APTBOT_CONFIG }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          mkdir -p secrets
          printf '%s' "$APTBOT_CONFIG" > config.json
          printf '%s' "$GOOGLE_SA_JSON" > secrets/service-account.json
      - if: steps.secrets.outputs.ok == 'true'
        name: Run
        run: |
          # The repo is public, and so are these logs: the bot's output goes to a
          # file, and only the summary (or, on failure, the last lines) is
          # shown, with the sheet ID, email addresses and ntfy topic removed.
          skip=immowelt # immowelt blocks datacenter IPs; it runs on the Mac
          if [ "$(date -u +%M)" -ge 15 ]; then
            skip=$skip,homecompany # 16 index pages per check: only once an hour
          fi
          status=0
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            ./aptbot -test-alert -config config.json > run.log 2>&1 || status=$?
          else
            ./aptbot -once -skip "$skip" -config config.json > run.log 2>&1 || status=$?
          fi
          redact() { sed -E -e 's#(spreadsheets/(d/)?|spreadsheetId=)[A-Za-z0-9_-]{20,}#\1…#g' -e 's#[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}#…@…#g' -e 's#(ntfy\.sh/)[A-Za-z0-9_-]+#\1…#g'; }
          if [ $status -ne 0 ]; then
            tail -n 15 run.log | cut -c1-300 | redact
            exit $status
          fi
          grep -E '\] [0-9]+ (results|listings)|run:|alerted|FAILED' run.log | cut -c1-200 | redact || true
      - if: always() && steps.secrets.outputs.ok == 'true'
        name: Save OpenStreetMap cache
        uses: actions/cache/save@v4
        with:
          path: aptbot/data/transit-cache.json
          key: transit-cache-${{ github.run_id }}
