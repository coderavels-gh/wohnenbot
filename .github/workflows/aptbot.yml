# Optional free cloud runner (private GitHub repo, ~1 min per run).
# State lives in the Google Sheet, so runs need no local storage.
# Caveat: GitHub runs on datacenter IPs; ImmoScout may block those. The two
# agency sites work fine. Your Mac (home IP) is the more reliable ImmoScout runner.
#
# Repo secrets needed: APTBOT_CONFIG (whole config.json),
# GOOGLE_SA_JSON (service-account key), CALLMEBOT_KEY_person1, CALLMEBOT_KEY_2
name: aptbot
on:
  schedule:
    - cron: "7,37 * * * *" # every 30 min (GitHub may delay scheduled runs by a few minutes)
  workflow_dispatch: {}
concurrency: aptbot
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: Write config
        env:
          APTBOT_CONFIG: ${{ secrets.APTBOT_CONFIG }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          mkdir -p secrets
          printf '%s' "$APTBOT_CONFIG" > config.json
          printf '%s' "$GOOGLE_SA_JSON" > secrets/service-account.json
      - name: Run
        env:
          CALLMEBOT_KEY_person1: ${{ secrets.CALLMEBOT_KEY_person1 }}
          CALLMEBOT_KEY_2: ${{ secrets.CALLMEBOT_KEY_2 }}
        run: go run ./cmd/aptbot -once -config config.json
